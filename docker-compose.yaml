version: '3.9'

# ─── Local Development Stack (without K8s) ────────────────────────────────────
# Run: docker-compose up -d
# App: http://localhost:8080

services:
  postgres:
    image: postgres:15-alpine
    container_name: taskflow-postgres
    environment:
      POSTGRES_DB:       taskdb
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: taskflow123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "taskdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: taskflow-redis
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskflow-backend
    image: taskflow-backend:latest
    environment:
      DB_HOST:     postgres
      DB_PORT:     "5432"
      DB_NAME:     taskdb
      DB_USER:     postgres
      DB_PASSWORD: taskflow123
      REDIS_HOST:  redis
      REDIS_PORT:  "6379"
      PORT:        "3001"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskflow-frontend
    image: taskflow-frontend:latest
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres-data:
