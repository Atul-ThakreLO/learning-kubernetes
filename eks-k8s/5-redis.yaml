############################################################
####################### Deployement ########################
############################################################

apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
  labels:
    name: redis-deployment
    app: taskflow
spec:
  replicas: 1
  selector:
    matchLabels:
      name: redis
      app: taskflow
      tier: cache
  template:
    metadata:
      name: redis
      labels:
        name: redis
        app: taskflow
        tier: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          
          ports:
            - containerPort: 6379

          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10


---

############################################################
######################### Service ##########################
############################################################

apiVersion: v1
kind: Service
metadata:
  name: redis-service
  labels:
    name: redis-service
    app: taskflow
    tier: network
spec:
  type: ClusterIP
  selector:
    name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
      
      