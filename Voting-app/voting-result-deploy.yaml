apiVersion: apps/v1
kind: Deployment
metadata:
  name: voting-result-deploy
  labels:
    name: voting-result-deploy
    app: voting-app
spec:
  replicas: 2
  selector:
    matchLabels:
      name: voting-result-pod
      app: voting-app
  template:
    metadata:
      name: voting-result-pod
      labels:
        name: voting-result-pod
        app: voting-app
    spec:
      containers:
        - name: voting-result
          image: kodekloud/examplevotingapp_result:v1
          ports:
            - containerPort: 80
