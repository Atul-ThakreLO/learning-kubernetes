# ─────────────────────────────────────────────────────────────────────────────
#  REDIS DEPLOYMENT
#
#  Redis runs in-memory, no PVC needed for practice.
#  To add AOF persistence: add args ["--appendonly", "yes"] and a volume.
#
#  Practice commands:
#    kubectl get pods -n taskflow -l app=redis
#    kubectl exec -it <redis-pod> -n taskflow -- redis-cli ping
#    kubectl exec -it <redis-pod> -n taskflow -- redis-cli keys '*'
#    kubectl exec -it <redis-pod> -n taskflow -- redis-cli monitor
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
  namespace: taskflow
  labels:
    app: redis
    tier: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        tier: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command: ["redis-server"]
          args:
            - "--maxmemory"
            - "128mb"
            - "--maxmemory-policy"
            - "allkeys-lru"      # Evict least-recently-used keys when full

          ports:
            - containerPort: 6379
              name: redis

          resources:
            requests:
              cpu:    "50m"
              memory: "64Mi"
            limits:
              cpu:    "200m"
              memory: "256Mi"

          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10

---
# ─────────────────────────────────────────────────────────────────────────────
#  REDIS SERVICE — ClusterIP (internal-only)
#  Backend pods reach Redis at: redis-service:6379
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: taskflow
  labels:
    app: redis
    tier: cache
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
