# ─────────────────────────────────────────────────────────────────────────────
#  PERSISTENT VOLUME — Cluster-level storage resource
#  hostPath type = node's local disk (fine for local practice, not production)
#
#  Practice:
#    kubectl get pv -n taskflow
#    kubectl describe pv postgres-pv
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv
  labels:
    app: postgres
    type: local
spec:
  storageClassName: manual
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce          # One node can mount read-write at a time
  hostPath:
    path: /data/postgres     # Path on the host node (create with: sudo mkdir -p /data/postgres)
  persistentVolumeReclaimPolicy: Retain   # Data survives PVC deletion

---
# ─────────────────────────────────────────────────────────────────────────────
#  PERSISTENT VOLUME CLAIM — Namespace-level storage request
#  The claim binds to postgres-pv via storageClassName & accessModes matching.
#
#  Practice:
#    kubectl get pvc -n taskflow
#    kubectl describe pvc postgres-pvc -n taskflow
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: taskflow
  labels:
    app: postgres
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
