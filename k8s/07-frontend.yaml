# ─────────────────────────────────────────────────────────────────────────────
#  FRONTEND DEPLOYMENT
#
#  Key concepts practiced here:
#  - Frontend served by nginx (static files + API proxy)
#  - 2 replicas for redundancy
#  - NodePort Service — exposes the app on the node's IP (accessible from host)
#
#  Practice commands:
#    kubectl get pods -n taskflow -l app=frontend
#    kubectl port-forward svc/frontend-service 8080:80 -n taskflow
#    minikube service frontend-service -n taskflow --url
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: taskflow
  labels:
    app: frontend
    tier: web
  annotations:
    kubernetes.io/change-cause: "Initial deployment v1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: frontend
        tier: web
    spec:
      containers:
        - name: frontend
          image: taskflow-frontend:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80
              name: http

          resources:
            requests:
              cpu:    "50m"
              memory: "64Mi"
            limits:
              cpu:    "200m"
              memory: "128Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20

---
# ─────────────────────────────────────────────────────────────────────────────
#  FRONTEND SERVICE — NodePort
#  Accessible from your browser at: http://<node-ip>:30080
#
#  With minikube:  minikube service frontend-service -n taskflow
#  With kind:      kubectl port-forward svc/frontend-service 8080:80 -n taskflow
#
#  Service types summary:
#    ClusterIP  → internal only          (postgres, redis, backend)
#    NodePort   → exposed on node port   (frontend for practice)
#    LoadBalancer → cloud load balancer  (production use)
#
#  Practice:
#    kubectl get svc frontend-service -n taskflow
#    kubectl describe svc frontend-service -n taskflow
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: taskflow
  labels:
    app: frontend
    tier: web
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 80                  # ClusterIP port (internal)
      targetPort: 80            # Container port
      nodePort: 30080           # Exposed on each node at this port (30000-32767)
      protocol: TCP
