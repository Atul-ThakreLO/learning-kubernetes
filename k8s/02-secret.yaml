# ─────────────────────────────────────────────────────────────────────────────
#  SECRET — Sensitive credentials
#  Values MUST be base64-encoded:
#    echo -n "postgres" | base64    →  cG9zdGdyZXM=
#    echo -n "taskflow123" | base64 →  dGFza2Zsb3cxMjM=
#
#  Practice:
#    kubectl get secret db-secret -n taskflow -o yaml
#    kubectl get secret db-secret -n taskflow -o jsonpath='{.data.DB_USER}' | base64 -d
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: taskflow
  labels:
    app: taskflow
type: Opaque
data:
  # echo -n "postgres"    | base64
  DB_USER:     cG9zdGdyZXM=
  # echo -n "taskflow123" | base64
  DB_PASSWORD: dGFza2Zsb3cxMjM=
